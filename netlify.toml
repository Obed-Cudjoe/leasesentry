# Netlify configuration for the Next.js App Router site.
# Committed so the deploy is fully reproducible from the repo (no dashboard fiddling).

# Netlify build config for the Next.js App Router site.
# Committed so the deploy is fully reproducible from the repo — no dashboard fiddling.
# The @netlify/plugin-nextjs plugin handles Next.js routing, API functions,
# image optimization, and generates the correct rewrites automatically.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
